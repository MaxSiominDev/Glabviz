[project]
name = "ci-insights"
description = "Local retrospective analytics for GitLab CI/CD pipelines"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
dependencies = [
    "duckdb>=1.1",
    "plotly>=5.24",
    "python-gitlab>=4.13",
    "streamlit>=1.39",
]

[project.scripts]
ci-insights = "ci_insights.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ci_insights/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_insights"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
